<div class="register-container">
  <div class="register-card">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">BudgetTracker</h1>
      <p class="text-gray-600">Create your account to start tracking your finances.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-6">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-full"
          [class.ng-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
        <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500">
          Please enter a valid email address.
        </small>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input
          pInputText
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full"
          [class.ng-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        />
        <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-red-500">
          Password must be at least 6 characters.
        </small>
        <div class="mt-2">
          <span role="button" tabindex="0" (click)="togglePasswordVisibility()" (keydown.enter)="togglePasswordVisibility()" class="text-sm text-blue-600 hover:text-blue-800 flex items-center show-password">
            <i class="pi pi-eye" *ngIf="!showPassword"></i>
            <i class="pi pi-eye-slash" *ngIf="showPassword"></i>
            <span class="ml-1">Show Password</span>
          </span>
        </div>
      </div>

      <p-button
        type="submit"
        label="Sign Up"
        [disabled]="form.invalid || loading"
        styleClass="w-full p-button-lg"
      ></p-button>

      <div *ngIf="errorMessage" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 text-sm">{{ errorMessage }}</p>
      </div>
    </form>

    <div class="mt-6 text-center">
      <p class="text-gray-600">
        Already have an account?
        <a routerLink="/login" class="text-indigo-600 hover:text-indigo-500 font-medium ml-1">Sign in</a>
      </p>
    </div>
  </div>
</div>

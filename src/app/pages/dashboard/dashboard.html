<main class="p-8">
  <!-- Summary Cards -->
  <section class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex items-center">
        <div class="p-3 rounded-full bg-green-100">
          <i class="pi pi-plus-circle text-green-600 text-2xl"></i>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">Total Income</p>
          <p class="text-2xl font-bold text-gray-900">${{ totalIncome.toFixed(2) }}</p>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex items-center">
        <div class="p-3 rounded-full bg-red-100">
          <i class="pi pi-minus-circle text-red-600 text-2xl"></i>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">Total Expense</p>
          <p class="text-2xl font-bold text-gray-900">${{ totalExpenses.toFixed(2) }}</p>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex items-center">
        <div class="p-3 rounded-full bg-blue-100">
          <i class="pi pi-wallet text-blue-600 text-2xl"></i>
        </div>
        <div class="ml-4">
          <p class="text-sm font-medium text-gray-600">Current Balance</p>
          <p class="text-2xl font-bold text-gray-900" [ngClass]="totalBalance >= 0 ? 'text-green-600' : 'text-red-600'">${{ totalBalance.toFixed(2) }}</p>
        </div>
      </div>
    </div>
  </section>

  <section class="mb-8">
    <p-card class="shadow-lg">
      <ng-template pTemplate="header">
        <div class="text-lg font-semibold text-gray-900">Expense Categories</div>
      </ng-template>
      <div class="w-full h-64 flex items-center justify-center dashboard-chart">
        <canvas baseChart
          [data]="expenseChartData"
          [options]="expenseChartOptions"
          [type]="'pie'">
        </canvas>
      </div>
      <div class="mt-4 grid grid-cols-2 gap-3" *ngIf="expenseCategories.length > 0">
        <div *ngFor="let category of expenseCategories" class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full" [style.backgroundColor]="category.color"></div>
          <span class="text-gray-600 text-sm">{{ category.name }}</span>
          <span class="text-gray-900 text-sm ml-auto">{{ (category.value / totalExpenses * 100).toFixed(1) }}%</span>
        </div>
      </div>
      <div *ngIf="expenseCategories.length === 0" class="text-center text-gray-500 mt-4">
        No expenses yet. Add some expenses to see the chart.
      </div>
    </p-card>
  </section>
</main>

<main class="p-8">
  <!-- Header Section -->
  <section class="bg-white rounded-lg shadow-md p-6 mb-8">
    <h1 class="text-gray-900 mb-2"><i class="pi pi-wallet"></i> Budgets</h1>
    <p class="text-gray-600">Create and manage your monthly budgets.</p>
  </section>

  <!-- Form Section -->
  <section class="bg-white rounded-lg shadow-md p-6 mb-8">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="grid grid-cols-1 gap-6 mb-6">
        <div class="mb-6">
          <label for="category" class="block text-sm font-medium text-gray-700 mb-2">Category</label>
          <input
            pInputText
            id="category"
            type="text"
            formControlName="category"
            placeholder="e.g., Food, Transport"
            class="w-full"
            [class.ng-invalid]="form.get('category')?.invalid && form.get('category')?.touched"
          />
          <small *ngIf="form.get('category')?.invalid && form.get('category')?.touched" class="text-red-500">
            Category is required.
          </small>
        </div>
        <div class="mb-6">
          <label for="limit" class="block text-sm font-medium text-gray-700 mb-2">Budget Limit</label>
          <input
            pInputText
            id="limit"
            type="number"
            formControlName="limit"
            step="0.01"
            placeholder="0.00"
            class="w-full"
            [class.ng-invalid]="form.get('limit')?.invalid && form.get('limit')?.touched"
          />
          <small *ngIf="form.get('limit')?.invalid && form.get('limit')?.touched" class="text-red-500">
            Limit is required.
          </small>
        </div>
        <div class="mb-6">
          <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
          <input
            pInputText
            id="description"
            type="text"
            formControlName="description"
            placeholder="Optional description"
            class="w-full"
          />
        </div>
        <div class="mb-6">
          <label for="period" class="block text-sm font-medium text-gray-700 mb-2">Period</label>
          <select
            id="period"
            formControlName="period"
            class="w-full p-2 border border-gray-300 rounded-md"
            [class.ng-invalid]="form.get('period')?.invalid && form.get('period')?.touched"
          >
            <option value="Monthly">Monthly</option>
            <option value="Weekly">Weekly</option>
            <option value="Yearly">Yearly</option>
          </select>
          <small *ngIf="form.get('period')?.invalid && form.get('period')?.touched" class="text-red-500">
            Period is required.
          </small>
        </div>
      </div>
      <p-button
        type="submit"
        label="Add Budget"
        icon="pi pi-plus"
        [disabled]="form.invalid"
        styleClass="p-button-lg add-budget-btn"
      ></p-button>
    </form>
  </section>

  <!-- Budgets Table Section -->
  <section class="bg-white rounded-lg shadow-md p-6">
    <h3 class="text-lg font-semibold mb-4">All Budgets</h3>
    <table class="w-full table-auto">
      <thead>
        <tr class="border-b">
          <th class="text-left py-2">Category</th>
          <th class="text-left py-2">Limit</th>
          <th class="text-left py-2">Description</th>
          <th class="text-left py-2">Date</th>
          <th class="text-left py-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let budget of budgets" class="border-b hover:bg-gray-50">
          <td class="py-3">{{ budget.category }}</td>
          <td class="py-3 text-green-500">${{ budget.limit.toFixed(2) }}</td>
          <td class="py-3">{{ budget.description || 'No description' }}</td>
          <td class="py-3">{{ budget.date | date }}</td>
          <td class="py-3">
            <button class="delete-btn" (click)="deleteBudget(budget.id)">
              <i class="pi pi-trash"></i>
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
